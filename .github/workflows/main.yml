name: Update activity graph

on:
  # Daily at 00:00 UTC (08:00 China Standard Time).
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-graphics-output
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate activity graph SVG
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: "bg_color=0d1117&color=c9d1d9&line=58a6ff&point=79c0ff&area_color=161b22&area=true&hide_border=true"
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate activity graph SVG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = ET.fromstring(Path("dist/activity-graph.svg").read_text(encoding="utf-8"))
          if root.tag != "{http://www.w3.org/2000/svg}svg":
              raise ValueError("Activity graph is not a valid SVG")

          # Error cards are also SVGs, but do not contain a plotted line.
          if not any(
              "ct-line" in element.get("class", "").split()
              for element in root.iter("{http://www.w3.org/2000/svg}path")
          ):
              raise ValueError("Activity graph is missing its plotted line")
          PY

      - name: Publish activity graph to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          # Preserve existing files and history, including the old snake SVGs.
          keep_history: true
          allow_empty_commit: false
          commit_message: "Update activity graph"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
